---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
Gemfile:
  optional:
    ":development":
    - gem: github_changelog_generator
    - gem: ruby-pwsh
    - gem: ffi
      platforms:
      - windows
spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.github/workflows/nightly.yml:
  unmanaged: false
  cron: '35 2 * * *'
.github/workflows/ci.yml:
  unmanaged: false
.github/workflows/mend.yml:
  unmanaged: false
.github/workflows/release_prep.yml:
  unmanaged: false
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/release.yml:
  unmanaged: false
.rubocop.yml:
  # the module has a .rubocop_todo.yml (MODULES-11997 pdk update)
  include_todos: true
.gitignore:
  # spec/fixtures/manifests/*.pp are committed fixtures for the deferred-resource
  # specs (CAT-2432); the template ignores that path, which fails check:git_ignore
  required:
    - '---/spec/fixtures/manifests/'
